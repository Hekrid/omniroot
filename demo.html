  /* Preview bar above the real OmniRoot app (Root's default dark theme, as members see it). */
  :root {
    --pv-bg: #151c26;
    --pv-bar: #101721;
    --pv-line: #283039;
    --pv-text: #f2f2f2;
    --pv-muted: #8b8f9c;
    --pv-accent: #3d6af8;
    color-scheme: dark;
  }
  body { background: var(--pv-bg); color: var(--pv-text); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--pv-bar); }
  .pv-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
    padding-block: 9px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--pv-bar); border-bottom: 1px solid var(--pv-line);
    font: 13px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .pv-tag { font-weight: 750; letter-spacing: 0.4px; text-transform: uppercase; font-size: 11px; color: var(--pv-muted); }
  .pv-views { display: flex; flex-wrap: wrap; gap: 4px; }
  .pv-views a {
    padding: 5px 11px; border-radius: 99px; color: var(--pv-muted); text-decoration: none; font-weight: 650;
    border: 1px solid transparent;
  }
  .pv-views a:hover { color: var(--pv-text); border-color: var(--pv-line); }
  .pv-views a[aria-current="true"] { background: var(--pv-accent); color: #fff; }
  .pv-views a:focus-visible, .pv-reset:focus-visible { outline: 2px solid var(--pv-accent); outline-offset: 2px; }
  .pv-note { color: var(--pv-muted); flex: 1 1 220px; min-width: 0; }
  .pv-reset {
    background: none; border: 1px solid var(--pv-line); color: var(--pv-text); border-radius: 8px;
    padding: 5px 10px; font: inherit; font-weight: 650; cursor: pointer;
  }
  .pv-reset:hover { border-color: var(--pv-muted); }

    <a href="#member" data-view="member">Miembro</a>
    <a href="#new" data-view="new">Miembro nuevo</a>
  </nav>
  <span class="pv-note">Comunidad de ejemplo con datos ficticios. En Root, los miembros no ven esta barra.</span>
  <button class="pv-reset" id="pv-reset" type="button">Restablecer</button>
</div>
<div id="root"></div>

<script>
  (function () {
    var views = ["owner", "mod", "member", "new"];
    var current = location.hash.replace("#", "");
    if (views.indexOf(current) < 0) current = "owner";
    document.querySelectorAll(".pv-views a").forEach(function (a) {
      if (a.dataset.view === current) a.setAttribute("aria-current", "true");
      // The app reads the view once at start, so switching views reloads the preview.
      a.addEventListener("click", function (e) {
        e.preventDefault();
        if (a.dataset.view === current) return;
        location.hash = a.dataset.view;
        location.reload();
      });
    });
    document.getElementById("pv-reset").addEventListener("click", function () {
      try { localStorage.removeItem("omniroot-mock-config"); } catch (err) { /* storage blocked: nothing saved anyway */ }
      location.reload();
    });
  })();
</script>

 even hours (UTC).":"I giochi iniziano allo scoccare dell'ora (es. 20:00, 21:00). Ogni 30 minuti aggiunge le :30; ogni 2 ore usa le ore pari (UTC).","Every {n} minutes":"Ogni {n} minuti","Games to mix":"Giochi da alternare","Questions follow the chat language; answers are accepted in any of OmniRoot's six languages.":"Le domande seguono la lingua della chat; le risposte sono accettate in tutte le sei lingue di OmniRoot.","A Games tab with a daily Wordle: the same five-letter word for everyone, in the chat language. Solving it earns XP, coins and season points. Members can share their coloured grid (no letters) in the games channel.":"Una scheda Giochi con un Wordle giornaliero: la stessa parola di cinque lettere per tutti, nella lingua della chat. Risolverlo dà XP, monete e punti stagione. I membri possono condividere la loro griglia colorata (senza lettere) nel canale dei giochi.","A new word every day at midnight UTC. Guesses must be real words.":"Una nuova parola ogni giorno a mezzanotte UTC. I tentativi devono essere parole vere.","Channel games":"Giochi nei canali","Always-on games in their own channel. Their messages don't earn XP, so they can't be farmed.":"Giochi sempre attivi nel loro canale. I loro messaggi non danno XP, quindi non si possono sfruttare.","Counting channel":"Canale della conta","Count up together, one number each. A wrong number or counting twice in a row starts over.":"Contate insieme, un numero a testa. Un numero sbagliato o contare due volte di fila fa ricominciare.","Word chain channel":"Canale della catena di parole","Each word starts with the last letter of the previous one, no repeats.":"Ogni parola inizia con l'ultima lettera della precedente, senza ripetizioni.","Counting: delete wrong numbers instead of starting over":"Conta: elimina i numeri sbagliati invece di ricominciare","Word chain: only accept real words (checked with Wiktionary, in the chat language or English)":"Catena di parole: accetta solo parole vere (verificate con Wiktionary, nella lingua della chat o in inglese)",Language:"Lingua","The language OmniRoot uses for its messages in chat, and the app's language for everyone who hasn't picked their own with the flag in the top-left corner.":"La lingua che OmniRoot usa per i suoi messaggi in chat, e la lingua dell'app per chi non ne ha scelta una con la bandiera in alto a sinistra.","Welcome, goodbye and level-up messages you haven't changed switch language too. Messages you wrote stay as they are.":"Anche i messaggi di benvenuto, addio e livello che non hai modificato cambiano lingua. Quelli che hai scritto tu restano come sono.","Profile pictures":"Immagini del profilo","Show members' Root profile pictures in OmniRoot (leaderboard, tickets, events…). When off (anonymous mode), everyone shows Root's default picture instead.":"Mostra le immagini del profilo Root dei membri in OmniRoot (classifica, ticket, eventi…). Se disattivato (modalità anonima), tutti mostrano l'immagine predefinita di Root.","Changes apply for everyone the next time they open or switch tabs in OmniRoot.":"Le modifiche valgono per tutti la prossima volta che aprono o cambiano scheda in OmniRoot.","Welcome & goodbye":"Benvenuto e addio","Greet people when they join {community}.":"Saluta le persone quando entrano in {community}.","Greet people when they join your community.":"Saluta le persone quando entrano nella tua community.","Welcome message":"Messaggio di benvenuto","Also post a goodbye message":"Pubblica anche un messaggio di addio","Goodbye message":"Messaggio di addio","Auto-roles":"Ruoli automatici","Roles given to every new member as soon as they join.":"Ruoli assegnati a ogni nuovo membro appena entra.","OmniRoot needs a role with Manage Roles to give these. The Setup tab shows it if a role couldn't be given.":"OmniRoot ha bisogno di un ruolo con Gestisci ruoli per assegnarli. La scheda Setup te lo segnala se un ruolo non è stato assegnato.",Leveling:"Livelli","Members earn XP for chatting and level up  mezza gli XP normali. Anche gli XP in vocale aumentano con ruoli e weekend.","Reset all XP":"Azzera tutti gli XP","Sets everyone back to level 0. This can't be undone.":"Riporta tutti al livello 0. Non si può annullare.","Click again to confirm":"Clicca di nuovo per confermare","Reset XP":"Azzera XP","Messages that collect enough reactions are reposted to a highlights channel. Members' own reactions on their message don't count.":"I messaggi che raccolgono abbastanza reazioni vengono ripubblicati in un canale dei migliori. Le reazioni dell'autore al proprio messaggio non contano.","Starboard channel":"Canale starboard",Reaction:"Reazione","Emoji name, e.g. star or fire":"Nome dell'emoji, es. star o fire","Reactions needed":"Reazioni necessarie","Language: {name}":"Lingua: {name}","Community default":"Predefinita della community","{into} of {total} XP":"{into} di {total} XP","You haven't earned any XP yet. Chat in the community to start climbing!":"Non hai ancora guadagnato XP. Scrivi nella community per iniziare a salire!","Your rank":"La tua posizione","Rank {periodLabel}":"Posizione {periodLabel}",Points:"Punti","XP earned":"XP guadagnati","Next: level {n}":"Prossimo: livello {n}","{n} XP to go":"mancano {n} XP","{n} messages":"{n} messaggi",You:"Tu","All time":"Sempre","This month":"Questo mese","This week":"Questa settimana",Season:"Stagione","Leveling is turned off in this community.":"I livelli sono disattivati in questa community.","This month's season: points from daily quests and chat games.":"La stagione di questo mese: punti dalle missioni giornaliere e dai giochi in chat.","Most XP earned this week.":"Più XP guadagnati questa settimana.","Most XP earned this month.":"Più XP guadagnati questo mese.","Top {length} members by XP.":"I primi {length} membri per XP."," Click someone to open their profile.":" Clicca su qualcuno per aprirne il profilo.","No season points yet. Finish a daily quest to get on the board!":"Ancora nessun punto stagione. Completa una ca privata per le azioni dell'auto-mod e i limiti di avvertimenti","Mod log channel":"Canale registro moderazione","Every warning, mute, kick, ban and auto-mod action is posted here.":"Ogni avvertimento, silenziamento, espulsione, ban e azione dell'auto-mod viene pubblicato qui.","No mod log":"Nessun registro",Muting:"Silenziamento","Muted members can't talk: OmniRoot removes their messages until the mute ends.":"I membri silenziati non possono parlare: OmniRoot rimuove i loro messaggi finché il silenziamento non termina.","Delete messages from muted members":"Elimina i messaggi dei membri silenziati","Also mute them in voice calls":"Silenziali anche nelle chiamate vocali","Muted role (optional)":"Ruolo silenziato (facoltativo)","Given while muted and removed afterwards. Set this role to 'cannot send messages' in Roles settings for a hard mute.":"Assegnato durante il silenziamento e rimosso dopo. Imposta questo ruolo su 'non può inviare messaggi' nelle impostazioni dei ruoli per un silenziamento totale.","Warning limit":"Limite di avvertimenti","Act automatically when a member collects too many warnings.":"Agisci automaticamente quando un membro accumula troppi avvertimenti.","Warnings before action":"Avvertimenti prima dell'azione","Do nothing":"Non fare nulla","Mute for (minutes)":"Silenzia per (minuti)","When the limit is reached, the member's warnings are cleared so the count starts again.":"Quando si raggiunge il limite, gli avvertimenti del membro vengono azzerati e il conteggio riparte.","Warnings expire after (days)":"Gli avvertimenti scadono dopo (giorni)","Older warnings stop counting towards the limit but stay in the history. 0 = never.":"Gli avvertimenti più vecchi non contano più per il limite ma restano nello storico. 0 = mai.","Raid alert":"Allarme raid","Warns moderators privately (and in the mod log) when lots of accounts join at once.":"Avvisa i moderatori in privato (e nel registro) quando entrano molti account insieme.","When it happens":"Quando ab where members post ideas and vote. Moderators mark them planned, done or declined, and the author gets a notification.":"Un onglet Suggestions où les membres proposent des idées et votent. Les modérateurs les marquent prévues, faites ou refusées, et l'auteur reçoit une notification.","Announce new suggestions in (optional)":"Annoncer les nouvelles suggestions dans (facultatif)","Moderators create events in the Events tab. Members sign up and get a private reminder before it starts.":"Les modérateurs créent des événements dans l'onglet Événements. Les membres s'inscrivent et reçoivent un rappel privé avant le début.","Default channel for event announcements":"Salon par défaut pour annoncer les événements","Remind people this many minutes before":"Rappeler aux gens ce nombre de minutes avant","0 = no reminder":"0 = pas de rappel",Achievements:"Succès","Badges members unlock by chatting, leveling, voting and more. They appear in the Me tab with a private notification when unlocked.":"Des badges que les membres débloquent en discutant, en montant de niveau, en votant et plus. Ils apparaissent dans l'onglet Moi avec une notification privée.","Achievements are on":"Les succès sont activés",Trivia:"Quiz","General knowledge":"Culture générale","Guess the flag":"Devine le drapeau","Country flags":"Drapeaux des pays","Word scramble":"Anagramme","Unscramble a word":"Remets un mot dans l'ordre","Quick maths":"Calcul rapide","First to solve it":"Le premier à le résoudre","Every 30 minutes":"Toutes les 30 minutes","Every hour":"Toutes les heures","Every 2 hours":"Toutes les 2 heures","Every 4 hours":"Toutes les 4 heures","Twice a day (00:00 and 12:00 UTC)":"Deux fois par jour (00:00 et 12:00 UTC)","Once a day (00:00 UTC)":"Une fois par jour (00:00 UTC)","Daily quests and streaks":"Quêtes quotidiennes et séries","Three short quests a day for each member, picked only from features you use. Quests keep a streak going (with shields for missed days) and earn season points and coins.":"Trois courtes quêtes par jour pour chaque membre, choisies uniquement parmi les fonctions que tu utilises. Elles entretiennent une série (avec des boucliers pour les jours manqués) et rapportent des points de saison et des pièces.","Announce each month's season podium in":"Annoncer le podium de chaque saison mensuelle dans","Seasons last a calendar month. Points come only from quests and capped chat-game wins, so spamming doesn't win.":"Les saisons durent un mois calendaire. Les points viennent seulement des quêtes et de victoires plafonnées aux jeux du chat, le spam ne fait donc pas gagner.","Timed chat games":"Jeux de chat programmés","A question is posted on a timer; the first correct answer wins XP, coins and season points. Moderators can start one any time with {p}game.":"Une question est publiée à intervalles ; la première bonne réponse gagne de l'XP, des pièces et des points de saison. Les modérateurs peuvent en lancer une à tout moment avec {p}game.","Games channel":"Salon des jeux",Off:"Désactivé","How often":"Fréquence","Games start on the hour (e.g. 20:00, 21:00). Every 30 minutes adds :30; every 2 hours uses even hours (UTC).":"Les jeux commencent à l'heure pile (ex. 20:00, 21:00). Toutes les 30 minutes ajoute :30 ; toutes les 2 heures utilise les heures paires (UTC).","Every {n} minutes":"Toutes les {n} minutes","Games to mix":"Jeux à alterner","Questions follow the chat language; answers are accepted in any of OmniRoot's six languages.":"Les questions suivent la langue du chat ; les réponses sont acceptées dans les six langues d'OmniRoot.","A Games tab with a daily Wordle: the same five-letter word for everyone, in the chat language. Solving it earns XP, coins and season points. Members can share their coloured grid (no letters) in the games channel.":"Un onglet Jeux avec un Wordle quotidien : le même mot de cinq lettres pour tout le monde, dans la langue du chat. Le résoudre rapporte de l'XP, des pièces et des points de saison. Les membres peuvent partager leur grille colorée (sans lettres) dans le salon des jeux.","A new word every day at midnight UTC. Guesses must be real words.":"Un nouveau mot chaque jour à minuit UTC. Les essais doivent être de vrais mots.","Channel games":"Jeux de salon","Always-on games in their own channel. Their messages don't earn XP, so they can't be farmed.":"Des jeux toujours actifs dans leur propre salon. Leurs messages ne rapportent pas d'XP, on ne peut donc pas en abuser.","Counting channel":"Salon de comptage","Count up together, one number each. A wrong number or counting twice in a row starts over.":"Comptez ensemble, un nombre chacun. Un mauvais nombre ou compter deux fois de suite fait recommencer.","Word chain channel":"Salon de chaîne de mots","Each word starts with the last letter of the previous one, no repeats.":"Chaque mot commence par la dernière lettre du précédent, sans répétition.","Counting: delete wrong numbers instead of starting over":"Comptage : supprimer les mauvais nombres au lieu de recommencer","Word chain: only accept real words (checked with Wiktionary, in the chat language or English)":"Chaîne de mots : n'accepter que de vrais mots (vérifiés avec Wiktionary, dans la langue du chat ou en anglais)",Language:"Langue","The language OmniRoot uses for its messages in chat, and the app's language for everyone who hasn't picked their own with the flag in the top-left corner.":"La langue qu'OmniRoot utilise pour ses messages dans le chat, et la langue de l'app pour ceux qui n'ont pas choisi la leur avec le drapeau en haut à gauche.","Welcome, goodbye and level-up messages you haven't changed switch language too. Messages you wrote stay as they are.":"Les messages de bienvenue, d'au revoir et de niveau que tu n'as pas modifiés changent aussi de langue. Ceux que tu as écrits restent tels quels.","Profile pictures":"Photos de profil","Show members' Root profile pictures in OmniRoot (leaderboard, tickets, events…). When off (anonymous mode), everyone shows Root's default picture instead.":"Affiche les photos de profil Root des membres dans OmniRoot (classement, tickets, événements…). Désactivé (mode anonyme), tout le monde affiche l'image par défaut de Root.","Changes apply for everyone the next time they open or switch tabs in OmniRoot.":"Les changements s'appliquent à tous la prochaine fois qu'ils ouvrent OmniRoot ou changent d'onglet.","Welcome & goodbye":"Bienvenue et au revoir","Greet people when they join {community}.":"Accueille les gens quand ils rejoignent {community}.","Greet people when they join your community.":"Accueille les gens quand ils rejoignent ta communauté.","Welcome message":"Message de bienvenue","Also post a goodbye message":"Publier aussi un message d'au revoir","Goodbye message":"Message d'au revoir","Auto-roles":"Rôles automatiques","Roles given to every new member as soon as they join.":"Rôles attribués à chaque nouveau membre dès son arrivée.","OmniRoot needs a role with Manage Roles to give these. The Setup tab shows it if a role couldn't be given.":"OmniRoot a besoin d'un rôle avec Gérer les rôles pour les attribuer. L'onglet Configuration l'indique si un rôle n'a pas pu être attribué.",Leveling:"Niveaux","Members earn XP for chatting and level up over time.":"Les membres gagnent de l'XP en discutant et montent de niveau avec le temps.","XP per message (min)":"XP par message (min)","XP per message (max)":"XP par message (max)","Cooldown (seconds)":"Délai (secondes)","XP is given at most once per cooldown.":"L'XP est donnée au plus une fois par délai.","Level-up announcements":"Annonces de niveau","Same channel as the message":"Même salon que le message","Announce level-ups in chat (reward roles are given either way)":"Annoncer les niveaux dans le chat (les rôles de récompense sont donnés de toute façon)","Level-up message":"Message de niveau","Shortest message that earns XP (letters)":"Message le plus court qui rapporte de l'XP (lettres)","Shorter messages, and a copy of someone's previous message, still count as messages but earn no XP. This keeps the board fair.":"Les messages plus courts, et la copie du message précédent de quelqu'un, comptent comme messages mais ne rapportent pas d'XP. Le classement reste ainsi équitable.","Channels that don't give XP":"Salons qui ne donnent pas d'XP","Role rewards":"Rôles de récompense","No rewards yet. Give members a role when they reach a level.":"Pas encore de récompense. Donne un rôle aux membres quand ils atteignent un niveau.",Level:"Niveau",gives:"donne","Remove reward":"Retirer la récompense","+ Add reward":"+ Ajouter une récompense","Only keep the highest reward role (remove lower ones)":"Garder seulement le rôle de récompense le plus élevé (retirer les inférieurs)","XP boosts":"Bonus d'XP","Extra XP for supporter roles, a channel or the weekend. When several apply, the biggest one counts.":"De l'XP en plus pour les rôles de soutien, un salon ou le week-end. Quand plusieurs s'appliquent, le plus grand compte.","Members with role":"Membres avec le rôle","Messages in channel":"Messages dans le salon","Weekends (Sat–Sun, UTC)":"Week-ends (sam–dim, UTC)","Everyone, every Saturday and Sunday":"Tout le monde, chaque samedi et dimanche","+ Add boost":"+ Ajouter un bonus","150% means one and a half times the usual XP. Voice XP is boosted by roles and weekends too.":"150 % signifie une fois et demie l'XP habituelle. L'XP vocale est aussi boostée par les rôles et les week-ends.","Reset all XP":"Réinitialiser toute l'XP","Sets everyone back to level 0. This can't be undone.":"Remet tout le monde au niveau 0. C'est irréversible.","Click again to confirm":"Clique à nouveau pour confirmer","Reset XP":"Réinitialiser l'XP","Messages that collect enough reactions are reposted to a highlights channel. Members' own reactions on their message don't count.":"Les messages qui reçoivent assez de réactions sont republiés dans un salon des meilleurs moments. Les réactions de l'auteur sur son propre message ne comptent pas.","Starboard channel":"Salon starboard",Reaction:"Réaction","Emoji name, e.g. star or fire":"Nom de l'emoji, ex. star ou fire","Reactions needed":"Réactions nécessaires","Language: {name}":"Langue : {name}","Community default":"Par défaut de la communauté","{into} of {total} XP":"{into} sur {total} XP","You haven't earned any XP yet. Chat in the community to start climbing!":"Tu n'as pas encore gagné d'XP. Discute dans la communauté pour commencer à grimper !","Your rank":"Ton rang","Rank {periodLabel}":"Rang {periodLabel}","XP earned":"XP gagnée","Next: level {n}":"Prochain : niveau {n}","{n} XP to go":"encore {n} XP",You:"Toi","All time":"Depuis toujours","This month":"Ce mois-ci","This week":"Cette semaine",Season:"Saison","Leveling is turned off in this community.":"Les niveaux sont désactivés dans cette communauté.","This month's season: points from daily quests and chat games.":"La saison de ce mois : points des quêtes quotidiennes et des jeux du chat.","Most XP earned this week.":"Le plus d'XP gagnée cette semaine.","Most XP earned this month.":"Le plus d'XP gagnée ce mois-ci.","Top {length} members by XP.":"Les {length} meilleurs membres en XP."," Click someone to open their profile.":" Clique sur quelqu'un pour ouvrir son profil.","No season points yet. Finish a daily quest to get on the board!":"Pas encore de points de saison. Termine une quête quotidienne pour entrer au classement !","No XP earned in this period yet.":"Pas encore d'XP gagnée sur cette période.","Nobody has earned XP yet. Be the first!":"Personne n'a encore gagné d'XP. Sois le premier !",Member:"Membre","Progress to next level":"Progression vers le niveau suivant","{v0} / {v1} XP to level {v2}":"{v0} / {v1} XP vers le niveau {v2}","this week":"cette semaine","this month":"ce mois-ci","this season":"cette saison","How leveling works":"Comment fonctionnent les niveaux","Chatting earns XP. There's a short cooldown, so spamming doesn't help.":"Discuter rapporte de l'XP. Il y a un court délai, le spam ne sert donc à rien.","If the community has voice XP on, time in voice channels counts too.":"Si la communauté a activé l'XP vocale, le temps passé en vocal compte aussi.","Some levels unlock roles automatically.":"Certains niveaux débloquent des rôles automatiquement.","unknown channel":"salon inconnu",Lockdown:"Verrouillage","During a raid or a heated moment, only moderators can write. Also in chat: {prefix}lockdown, {v1}lockdown all, {v2}unlock.":"Pendant un raid ou un moment tendu, seuls les modérateurs peuvent écrire. Aussi dans le chat : {prefix}lockdown, {v1}lockdown all, {v2}unlock.",Locked:"Verrouillé",Unlock:"Déverrouiller","Pick a channel…":"Choisis un salon…","Lock channel":"Verrouiller le salon","Lock everything":"Tout verrouiller","Root apps can't change channel permissions, so OmniRoot removes other members' messages while a channel is locked.":"Les apps Root ne peuvent pas changer les permissions des salons, OmniRoot supprime donc les messages des autres membres tant qu'un salon est verrouillé.",Moderators:"Modérateurs","Who can use the moderation commands in chat. Admins, and roles that can kick or ban, always can.":"Qui peut utiliser les commandes de modération dans le chat. Les admins, et les rôles qui peuvent expulser ou bannir, le peuvent toujours.","Moderator roles":"Rôles de modérateur","Send moderators a private notification for auto-mod actions and warning limits":"Envoyer aux modérateurs une notification privée pour les actions de l'auto-mod et les limites d'avertissements","Mod log channel":"Salon du journal de modération","Every warning, mute, kick, ban and auto-mod action is posted here.":"Chaque avertissement, sourdine, expulsion, bannissement et action de l'auto-mod est publié ici.","No mod log":"Pas de journal",Muting:"Sourdines","Muted members can't talk: OmniRoot removes their messages until the mute ends.":"Les membres en sourdine ne peuvent pas parler : OmniRoot supprime leurs messages jusqu'à la fin de la sourdine.","Delete messages from muted members":"Supprimer les messages des membres en sourdine","Also mute them in voice calls":"Les rendre muets aussi en vocal","Muted role (optional)":"Rôle en sourdine (facultatif)","Given while muted and removed afterwards. Set this role to 'cannot send messages' in Roles settings for a hard mute.":"Attribué pendant la sourdine puis retiré. Règle ce rôle sur « ne peut pas envoyer de messages » dans les réglages des rôles pour une sourdine stricte.","Warning limit":"Limite d'avertissements","Act automatically when a member collects too many warnings.":"Agir automatiquement quand un membre cumule trop d'avertissements.","Warnings before action":"Avertissements avant action","Do nothing":"Ne rien faire","Mute for (minutes)":"Sourdine pendant (minutes)","When the limit is reached, the member's warnings are cleared so the count starts again.":"Quand la limite est atteinte, les avertissements du membre sont effacés et le compte repart.","Warnings expire after (days)":"Les avertissements expirent après (jours)","Older warnings stop counting towards the limit but stay in the history. 0 = never.":"Les anciens avertissements ne comptent plus pour la limite mais restent dans l'historique. 0 = jamais.","Raid alert":"Alerte raid","Warns moderators privately (and in the mod log) when lots of accounts join at once.":"Prévient les modérateurs en privé (et dans le journal) quand beaucoup de comptes arrivent en même temps.","When it happens":"Quand ça arrive","Alert moderators":"Alerter les modérateurs","Alert moderators and kick the new accounts (and anyone joining in the next 10 minutes)":"Alerter les modérateurs et expulser les nouveaux comptes (et quiconque arrive dans les 10 minutes)","Alert when this many join…":"Alerter quand autant arrivent…","…within (seconds)":"…en (secondes)","Banned members' data":"Données des membres bannis","Members who leave keep their XP, coins, streaks and other progress in case they come back. When someone is banned, OmniRoot removes their progress. Warnings, cases, tickets and applications always stay.":"Les membres qui partent gardent leur XP, leurs pièces, séries et autres progrès au cas où ils reviennent. Quand quelqu'un est banni, OmniRoot supprime sa progression. Avertissements, cas, tickets et candidatures restent toujours.","Temporary bans made with OmniRoot (commands or auto-mod strikes) keep the data.":"Les bannissements temporaires faits avec OmniRoot (commandes ou avertissements de l'auto-mod) gardent les données.","Member log":"Journal des membres","Joins, leaves, finished welcome steps, accepted applications and roles OmniRoot gives or takes.":"Arrivées, départs, étapes de bienvenue terminées, candidatures acceptées et rôles qu'OmniRoot donne ou retire.","Log channel":"Salon du journal","Message log":"Journal des messages","Posts edited and deleted messages to a staff channel, so moderators can see what was changed or removed.":"Publie les messages modifiés et supprimés dans un salon du staff, pour que les modérateurs voient ce qui a changé ou été retiré.","To show what a message said, OmniRoot keeps recent messages in memory for up to 24 hours while this is on. Nothing is written to disk. Messages from before a restart can't be shown.":"Pour montrer ce que disait un message, OmniRoot garde les messages récents en mémoire jusqu'à 24 heures tant que c'est activé. Rien n'est écrit sur disque. Les messages d'avant un redémarrage ne peuvent pas être affichés.","Pick a channel only moderators can read. Auto-mod now also checks messages when they're edited.":"Choisis un salon que seuls les modérateurs peuvent lire. L'auto-mod vérifie aussi les messages modifiés.",January:"Janvier",February:"Février",March:"Mars",April:"Avril",May:"Mai",June:"Juin",July:"Juillet",August:"Août",September:"Septembre",October:"Octobre",November:"Novembre",December:"Décembre","Your profile in this community.":"Ton profil dans cette communauté.","{n} of {total} unlocked":"{n} sur {total} débloqués","Unlocked {v0}":"Débloqué le {v0}","Not unlocked yet":"Pas encore débloqué",Reminders:"Rappels",Type:"Tape","take the pizza out":"sors la pizza du four","in any channel and OmniRoot will send you a private notification when it's time. Use s, m, h, d or w, up to 30 days.":"dans n'importe quel salon et OmniRoot t'enverra une notification privée le moment venu. Utilise s, m, h, d ou w, jusqu'à 30 jours.",Profile:"Profil","Claim daily +{dailyCoins} {coinName}":"Récupérer le quotidien +{dailyCoins} {coinName}","Daily claimed · back tomorrow":"Quotidien récupéré · reviens demain",Birthday:"Anniversaire","On your day OmniRoot wishes you happy birthday. Only the day and month are saved.":"Le jour venu, OmniRoot te souhaite bon anniversaire. Seuls le jour et le mois sont enregistrés.",Day:"Jour",Month:"Mois","Save birthday":"Enregistrer l'anniversaire","Gaming community":"Communauté gaming","Levels with voice XP, daily quests and seasons, plus trivia, flag and word games on a timer.":"Niveaux avec XP vocale, quêtes quotidiennes et saisons, plus quiz, drapeaux et jeux de mots programmés.","Creator or fan community":"Communauté de créateur ou de fans","Suggestions members vote on, birthdays, achievements and daily quests.":"Suggestions votées par les membres, anniversaires, succès et quêtes quotidiennes.","Study or work group":"Groupe d'études ou de travail","Quiet by default: levels without announcements, and private support tickets to the staff.":"Calme par défaut : niveaux sans annonces et tickets de support privés au staff.","Just the basics":"Juste l'essentiel","Protection against spam, scams and raids, and a welcome message. Add the rest later.":"Protection contre le spam, les arnaques et les raids, et un message de bienvenue. Ajoute le reste plus tard.","the default channel":"le salon par défaut","Chat language: {v0}":"Langue du chat : {v0}","Welcome message in {v0}":"Message de bienvenue dans {v0}","Welcome message turned off":"Message de bienvenue désactivé","Auto-mod (spam, invites, scam links)":"Auto-mod (spam, invitations, liens d'arnaque)","Suspicious links are removed":"Les liens suspects sont supprimés","Mod log in {v0}":"Journal de modération dans {v0}","Member log in {v0}":"Journal des membres dans {v0}","Message log in {v0}":"Journal des messages dans {v0}","Chat games in {v0}":"Jeux du chat dans {v0}","Voice XP":"XP vocale","Support tickets":"Tickets de support","Quiet level-ups":"Niveaux discrets","Okay, set things up from the pages on the left.":"D'accord, règle tout depuis les pages à gauche.","Quick setup applied":"Configuration rapide appliquée","All set!":"Tout est prêt !","Quick setup turned on:":"La configuration rapide a activé :","Everything this template turns on was already set up, so nothing needed to change.":"Tout ce que ce modèle active était déjà configuré, rien n'a donc changé.","Fine-tune anything from the pages on the left, or search for a setting at the top.":"Affine ce que tu veux depuis les pages à gauche, ou cherche un réglage en haut.","Back to templates":"Retour aux modèles","Community type":"Type de communauté","Language in chat":"Langue dans le chat","Greet new members in":"Accueillir les nouveaux membres dans","No welcome message":"Pas de message de bienvenue","The community's default channel":"Le salon par défaut de la communauté","Keep a staff log in":"Tenir un journal du staff dans","Best kept visible to staff only.":"À garder visible uniquement par le staff.","No log":"Pas de journal","Channel for timed chat games (optional)":"Salon pour les jeux de chat programmés (facultatif)","A trivia, flag, word or maths question is posted here every hour.":"Une question de quiz, drapeau, mot ou calcul est publiée ici toutes les heures.","Skip this":"Passer","OmniRoot switches on sensible defaults. It only turns things on, so nothing you already set is removed.":"OmniRoot active des réglages raisonnables. Il ne fait qu'activer, donc rien de ce que tu as déjà réglé n'est retiré.","Setting up…":"Configuration…","Set it up":"Configurer","I'll do it by hand":"Je le ferai à la main","{finished} of {started} members who opened the steps have finished them.":"{finished} des {started} membres qui ont ouvert les étapes les ont terminées.","Welcome page":"Page de bienvenue","New members land on this page in OmniRoot while they have steps to do (rules, roles, introduction). Afterwards it stays as the Rules tab, next to Support. It appears when Welcome steps or Rules & verification is on.":"Les nouveaux membres arrivent sur cette page dans OmniRoot tant qu'ils ont des étapes à faire (règles, rôles, présentation). Ensuite elle reste comme onglet Règles, à côté de Support. Elle apparaît quand les Étapes de bienvenue ou Règles et vérification sont activées.","Message at the top":"Message en haut","Shown under “Welcome to {community}, {name}!”. Leave empty for a short default greeting.":"Affiché sous « Bienvenue sur {community}, {name} ! ». Laisse vide pour un court message par défaut.","\uD83D\uDC4B We're glad you're here!\n\n\uD83D\uDCCC Read the rules, pick a few roles and say hi.":`\uD83D\uDC4B Content de te voir ici !

lenmenüs.","Birthdays, suggestions, events and achievements.":"Geburtstage, Vorschläge, Events und Erfolge.","Games & quests":"Spiele & Quests","Daily quests, streaks and seasons, timed chat games, counting and word chain.":"Tägliche Quests, Serien und Saisons, zeitgesteuerte Chatspiele, Zählen und Wortkette.","Coins & shop":"Münzen & Shop","A currency members earn by chatting, and roles they can buy.":"Eine Währung, die Mitglieder durch Chatten verdienen, und Rollen, die sie kaufen können.","Tickets & forms":"Tickets & Formulare","Private support tickets and application forms, answered in the Support tab.":"Private Support-Tickets und Bewerbungsformulare, beantwortet im Support-Tab.","Commands & replies":"Befehle & Antworten","The command prefix, your own commands, automatic replies and sticky messages.":"Das Befehlspräfix, eigene Befehle, automatische Antworten und Sticky-Nachrichten.",Announcements:"Ankündigungen","Scheduled posts plus news and YouTube alerts.":"Geplante Posts sowie News- und YouTube-Benachrichtigungen.",Voice:"Sprache","Temporary voice channels and XP for time in voice.":"Temporäre Sprachkanäle und XP für Zeit im Sprachchat.",Safety:"Sicherheit","Moderators, muting, the warning limit, raid alerts and the message log.":"Moderatoren, Stummschaltung, Verwarnungslimit, Raid-Warnungen und Nachrichtenprotokoll.","Rules that remove unwanted messages automatically.":"Regeln, die unerwünschte Nachrichten automatisch entfernen.",Cases:"Fälle","Everything moderators and auto-mod have done, who is muted or banned, and moderator notes.":"Alles, was Moderatoren und Auto-Mod getan haben, wer stumm oder gebannt ist, und Moderatorennotizen.",Stats:"Statistiken",Insights:"Einblicke","How active the community is.":"Wie aktiv die Community ist.","Only OmniRoot managers can open the dashboard.":"Nur OmniRoot-Verwalter können das Dashboard öffnen.","Changes saved":"Änderungen gespeichert","XP reset for 1 member":"XP für 1 Mitglied zurückgesetzt","XP reset for {n} members":"XP für {n} Mitglieder zurückgesetzt","Couldn't load the dashboard.":"Dashboard konnte nicht geladen werden.","Try again":"Erneut versuchen","Dashboard sections":"Dashboard-Bereiche","Search settings…":"Einstellungen suchen…","Nothing found.":"Nichts gefunden.","You have unsaved changes":"Du hast ungespeicherte Änderungen",Discard:"Verwerfen","Saving…":"Wird gespeichert…","Save changes":"Änderungen speichern",Coins:"Münzen","Members earn coins when a message earns XP, plus a daily reward, and spend them in the Shop tab.":"Mitglieder verdienen Münzen, wenn eine Nachricht XP bringt, plus eine tägliche Belohnung, und geben sie im Shop-Tab aus.","Name of the currency":"Name der Währung","e.g. coins, gems, roots":"z. B. Münzen, Edelsteine, Roots","{coin} per message":"{coin} pro Nachricht","Given at most once per XP cooldown":"Höchstens einmal pro XP-Abklingzeit vergeben","Daily reward":"Tägliche Belohnung","0 = no daily reward":"0 = keine tägliche Belohnung","Roles members can buy. OmniRoot needs a role with Manage Roles to hand them out.":"Rollen, die Mitglieder kaufen können. OmniRoot braucht eine Rolle mit Rollen verwalten, um sie zu vergeben.","No items yet.":"Noch keine Artikel.","Price ({coin})":"Preis ({coin})","Role given":"Vergebene Rolle","Choose a role…":"Rolle wählen…","Description (optional)":"Beschreibung (optional)","Items need a name and a role to be saved.":"Artikel brauchen einen Namen und eine Rolle, um gespeichert zu werden.","+ Add item":"+ Artikel hinzufügen",Birthdays:"Geburtstage","Members save their birthday in the Me tab (or with the birthday command). OmniRoot celebrates them on the day, in UTC.":"Mitglieder speichern ihren Geburtstag im Ich-Tab (oder mit dem Befehl birthday). OmniRoot feiert sie am Tag selbst, in UTC.","Post birthday wishes in":"Glückwünsche posten in","Community default channel":"Standardkanal der Community","Birthday role for the day (optional)":"Geburtstagsrolle für den Tag (optional)","Given on their birthday and taken back after 24 hours.":"Am Geburtstag vergeben und nach 24 Stunden wieder entfernt.","No role":"Keine Rolle","A Suggestions tab where members post ideas and vote. Moderators mark them planned, done or declined, and the author gets a notification.":"Ein Vorschläge-Tab, in dem Mitglieder Ideen posten und abstimmen. Moderatoren markieren sie als geplant, erledigt oder abgelehnt, und der Autor wird benachrichtigt.","Announce new suggestions in (optional)":"Neue Vorschläge ankündigen in (optional)","Moderators create events in the Events tab. Members sign up and get a private reminder before it starts.":"Moderatoren erstellen Events im Events-Tab. Mitglieder melden sich an und bekommen vor Beginn eine private Erinnerung.","Default channel for event announcements":"Standardkanal für Event-Ankündigungen","Remind people this many minutes before":"So viele Minuten vorher erinnern","0 = no reminder":"0 = keine Erinnerung",Achievements:"Erfolge","Badges members unlock by chatting, leveling, voting and more. They appear in the Me tab with a private notification when unlocked.":"Abzeichen, die Mitglieder durch Chatten, Leveln, Abstimmen und mehr freischalten. Sie erscheinen im Ich-Tab mit einer privaten Benachrichtigung.","Achievements are on":"Erfolge sind an",Trivia:"Quiz","General knowledge":"Allgemeinwissen","Guess the flag":"Errate die Flagge","Country flags":"Länderflaggen","Word scramble":"Wortsalat","Unscramble a word":"Ordne ein Wort","Quick maths":"Kopfrechnen","First to solve it":"Wer zuerst löst","Every 30 minutes":"Alle 30 Minuten","Every hour":"Jede Stunde","Every 2 hours":"Alle 2 Stunden","Every 4 hours":"Alle 4 Stunden","Twice a day (00:00 and 12:00 UTC)":"Zweimal täglich (00:00 und 12:00 UTC)","Once a day (00:00 UTC)":"Einmal täglich (00:00 UTC)","Daily quests and streaks":"Tägliche Quests & Serien","Three short quests a day for each member, picked only from features you use. Quests keep a streak going (with shields for missed days) and earn season points and coins.":"Drei kurze Quests pro Tag für jedes Mitglied, nur aus Funktionen, die du nutzt. Quests halten eine Serie am Laufen (mit Schilden für verpasste Tage) und bringen Saisonpunkte und Münzen.","Announce each month's season podium in":"Saison-Podium jedes Monats ankündigen in","Seasons last a calendar month. Points come only from quests and capped chat-game wins, so spamming doesn't win.":"Saisons dauern einen Kalendermonat. Punkte gibt es nur für Quests und begrenzte Chatspiel-Siege, Spammen gewinnt also nicht.","Timed chat games":"Zeitgesteuerte Chatspiele","A question is posted on a timer; the first correct answer wins XP, coins and season points. Moderators can start one any time with {p}game.":"Eine Frage wird nach Zeitplan gepostet; die erste richtige Antwort gewinnt XP, Münzen und Saisonpunkte. Moderatoren können jederzeit eine mit {p}game starten.","Games channel":"Spielekanal",Off:"Aus","How often":"Wie oft","Games start on the hour (e.g. 20:00, 21:00). Every 30 minutes adds :30; every 2 hours uses even hours (UTC).":"Spiele starten zur vollen Stunde (z. B. 20:00, 21:00). Alle 30 Minuten fügt :30 hinzu; alle 2 Stunden nutzt gerade Stunden (UTC).","Every {n} minutes":"Alle {n} Minuten","Games to mix":"Spiele im Mix","Questions follow the chat language; answers are accepted in any of OmniRoot's six languages.":"Fragen folgen der Chatsprache; Antworten werden in allen sechs Sprachen von OmniRoot akzeptiert.","A Games tab with a daily Wordle: the same five-letter word for everyone, in the chat language. Solving it earns XP, coins and season points. Members can share their coloured grid (no letters) in the games channel.":"Ein Spiele-Tab mit einem täglichen Wordle: dasselbe Fünf-Buchstaben-Wort für alle, in der Chatsprache. Lösen bringt XP, Münzen und Saisonpunkte. Mitglieder können ihr farbiges Raster (ohne Buchstaben) im Spielekanal teilen.","A new word every day at midnight UTC. Guesses must be real words.":"Jeden Tag um Mitternacht UTC ein neues Wort. Versuche müssen echte Wörter sein.","Channel games":"Kanalspiele","Always-on games in their own channel. Their messages don't earn XP, so they can't be farmed.":"Dauerhafte Spiele in einem eigenen Kanal. Ihre Nachrichten bringen keine XP, damit sie nicht ausgenutzt werden.","Counting channel":"Zählkanal","Count up together, one number each. A wrong number or counting twice in a row starts over.":"Zählt gemeinsam hoch, jeder eine Zahl. Eine falsche Zahl oder zweimal hintereinander zählen startet neu.","Word chain channel":"Wortkettenkanal","Each word starts with the last letter of the previous one, no repeats.":"Jedes Wort beginnt mit dem letzten Buchstaben des vorherigen, keine Wiederholungen.","Counting: delete wrong numbers instead of starting over":"Zählen: falsche Zahlen löschen statt neu zu starten","Word chain: only accept real words (checked with Wiktionary, in the chat language or English)":"Wortkette: nur echte Wörter akzeptieren (mit Wiktionary geprüft, in der Chatsprache oder Englisch)",Language:"Sprache","The language OmniRoot uses for its messages in chat, and the app's language for everyone who hasn't picked their own with the flag in the top-left corner.":"Die Sprache, die OmniRoot für Chatnachrichten nutzt, und die Sprache der App für alle, die mit der Flagge oben links keine eigene gewählt haben.","Welcome, goodbye and level-up messages you haven't changed switch language too. Messages you wrote stay as they are.":"Willkommens-, Abschieds- und Level-up-Nachrichten, die du nicht geändert hast, wechseln auch die Sprache. Selbst geschriebene bleiben, wie sie sind.","Profile pictures":"Profilbilder","Show members' Root profile pictures in OmniRoot (leaderboard, tickets, events…). When off (anonymous mode), everyone shows Root's default picture instead.":"Zeigt die Root-Profilbilder der Mitglieder in OmniRoot (Rangliste, Tickets, Events…). Ausgeschaltet (anonymer Modus) zeigen alle Roots Standardbild.","Changes apply for everyone the next time they open or switch tabs in OmniRoot.":"Änderungen gelten für alle beim nächsten Öffnen oder Tab-Wechsel in OmniRoot.","Welcome & goodbye":"Willkommen & Abschied","Greet people when they join {community}.":"Begrüße Leute, wenn sie {community} beitreten.","Greet people when they join your community.":"Begrüße Leute, wenn sie deiner Community beitreten.","Welcome message":"Willkommensnachricht","Also post a goodbye message":"Auch eine Abschiedsnachricht posten","Goodbye message":"Abschiedsnachricht","Auto-roles":"Auto-Rollen","Roles given to every new member as soon as they join.":"Rollen, die jedes neue Mitglied direkt beim Beitritt bekommt.","OmniRoot needs a role with Manage Roles to give these. The Setup tab shows it if a role couldn't be given.":"OmniRoot braucht eine Rolle mit Rollen verwalten, um sie zu vergeben. Der Setup-Tab zeigt es an, wenn eine Rolle nicht vergeben werden konnte.",Leveling:"Level","Members earn XP for chatting and level up over time.":"Mitglieder verdienen XP durch Chatten und steigen mit der Zeit im Level.","XP per message (min)":"XP pro Nachricht (min.)","XP per message (max)":"XP pro Nachricht (max.)","Cooldown (seconds)":"Abklingzeit (Sekunden)","XP is given at most once per cooldown.":"XP gibt es höchstens einmal pro Abklingzeit.","Level-up announcements":"Level-up-Ankündigungen","Same channel as the message":"Gleicher Kanal wie die Nachricht","Announce level-ups in chat (reward roles are given either way)":"Level-ups im Chat ankündigen (Belohnungsrollen gibt es trotzdem)","Level-up message":"Level-up-Nachricht","Shortest message that earns XP (letters)":"Kürzeste Nachricht, die XP bringt (Buchstaben)","Shorter messages, and a copy of someone's previous message, still count as messages but earn no XP. This keeps the board fair.":"Kürzere Nachrichten und Kopien der vorherigen Nachricht von jemandem zählen als Nachrichten, bringen aber keine XP. So bleibt die Rangliste fair.","Channels that don't give XP":"Kanäle ohne XP","Role rewards":"Belohnungsrollen","No rewards yet. Give members a role when they reach a level.":"Noch keine Belohnungen. Gib Mitgliedern eine Rolle, wenn sie ein Level erreichen.",gives:"gibt","Remove reward":"Belohnung entfernen","+ Add reward":"+ Belohnung hinzufügen","Only keep the highest reward role (remove lower ones)":"Nur die höchste Belohnungsrolle behalten (niedrigere entfernen)","XP boosts":"XP-Boosts","Extra XP for supporter roles, a channel or the weekend. When several apply, the biggest one counts.":"Extra-XP für Unterstützerrollen, einen Kanal oder das Wochenende. Wenn mehrere gelten, zählt der größte.","Members with role":"Mitglieder mit Rolle","Messages in channel":"Nachrichten im Kanal","Weekends (Sat–Sun, UTC)":"Wochenenden (Sa–So, UTC)","Everyone, every Saturday and Sunday":"Alle, jeden Samstag und Sonntag","+ Add boost":"+ Boost hinzufügen","150% means one and a half times the usual XP. Voice XP is boosted by roles and weekends too.":"150 % bedeutet das Eineinhalbfache der üblichen XP. Sprach-XP werden auch durch Rollen und Wochenenden verstärkt.","Reset all XP":"Alle XP zurücksetzen","Sets everyone back to level 0. This can't be undone.":"Setzt alle auf Level 0 zurück. Das lässt sich nicht rückgängig machen.","Click again to confirm":"Erneut klicken zum Bestätigen","Reset XP":"XP zurücksetzen","Messages that collect enough reactions are reposted to a highlights channel. Members' own reactions on their message don't count.":"Nachrichten mit genug Reaktionen werden in einen Highlight-Kanal gepostet. Eigene Reaktionen auf die eigene Nachricht zählen nicht.","Starboard channel":"Starboard-Kanal",Reaction:"Reaktion","Emoji name, e.g. star or fire":"Emoji-Name, z. B. star oder fire","Reactions needed":"Benötigte Reaktionen","Language: {name}":"Sprache: {name}","Community default":"Standard der Community","{into} of {total} XP":"{into} von {total} XP","You haven't earned any XP yet. Chat in the community to start climbing!":"Du hast noch keine XP. Chatte in der Community, um aufzusteigen!","Your rank":"Dein Rang","Rank {periodLabel}":"Rang {periodLabel}",Points:"Punkte","XP earned":"Verdiente XP","Next: level {n}":"Nächstes: Level {n}","{n} XP to go":"noch {n} XP","{n} messages":"{n} Nachrichten",You:"Du","All time":"Gesamt","This month":"Diesen Monat","This week":"Diese Woche",Season:"Saison","Leveling is turned off in this community.":"Level sind in dieser Community ausgeschaltet.","This month's season: points from daily quests and chat games.":"Die Saison dieses Monats: Punkte aus täglichen Quests und Chatspielen.","Most XP earned this week.":"Meiste XP diese Woche.","Most XP earned this month.":"Meiste XP diesen Monat.","Top {length} members by XP.":"Top {length} Mitglieder nach XP."," Click someone to open their profile.":" Klick auf jemanden, um das Profil zu öffnen.","No season points yet. Finish a daily quest to get on the board!":"Noch keine Saisonpunkte. Schaff eine tägliche Quest, um auf die Liste zu kommen!","No XP earned in this period yet.":"In diesem Zeitraum noch keine XP verdient.","Nobody has earned XP yet. Be the first!":"Noch niemand hat XP verdient. Sei der Erste!",Member:"Mitglied","Progress to next level":"Fortschritt zum nächsten Level","{v0} / {v1} XP to level {v2}":"{v0} / {v1} XP bis Level {v2}","this week":"diese Woche","this month":"diesen Monat","this season":"diese Saison","How leveling works":"So funktionieren Level","Chatting earns XP. There's a short cooldown, so spamming doesn't help.":"Chatten bringt XP. Es gibt eine kurze Abklingzeit, Spammen hilft also nicht.","If the community has voice XP on, time in voice channels counts too.":"Wenn die Community Sprach-XP aktiviert hat, zählt auch Zeit in Sprachkanälen.","Some levels unlock roles automatically.":"Manche Level schalten automatisch Rollen frei.","unknown channel":"unbekannter Kanal",Lockdown:"Sperre","During a raid or a heated moment, only moderators can write. Also in chat: {prefix}lockdown, {v1}lockdown all, {v2}unlock.":"Bei einem Raid oder hitzigen Moment können nur Moderatoren schreiben. Auch im Chat: {prefix}lockdown, {v1}lockdown all, {v2}unlock.",Locked:"Gesperrt",Unlock:"Entsperren","Pick a channel…":"Kanal wählen…","Lock channel":"Kanal sperren","Lock everything":"Alles sperren","Root apps can't change channel permissions, so OmniRoot removes other members' messages while a channel is locked.":"Root-Apps können Kanalberechtigungen nicht ändern, daher entfernt OmniRoot die Nachrichten anderer Mitglieder, solange ein Kanal gesperrt ist.",Moderators:"Moderatoren","Who can use the moderation commands in chat. Admins, and roles that can kick or ban, always can.":"Wer die Moderationsbefehle im Chat nutzen darf. Admins und Rollen, die kicken oder bannen dürfen, immer.","Moderator roles":"Moderatorrollen","Send moderators a private notification for auto-mod actions and warning limits":"Moderatoren privat über Auto-Mod-Aktionen und Verwarnungslimits benachrichtigen","Mod log channel":"Mod-Log-Kanal","Every warning, mute, kick, ban and auto-mod action is posted here.":"Jede Verwarnung, Stummschaltung, jeder Kick, Bann und jede Auto-Mod-Aktion wird hier gepostet.","No mod log":"Kein Mod-Log",Muting:"Stummschaltung","Muted members can't talk: OmniRoot removes their messages until the mute ends.":"Stummgeschaltete Mitglieder können nicht schreiben: OmniRoot entfernt ihre Nachrichten, bis die Stummschaltung endet.","Delete messages from muted members":"Nachrichten stummgeschalteter Mitglieder löschen","Also mute them in voice calls":"Auch in Sprachanrufen stummschalten","Muted role (optional)":"Stumm-Rolle (optional)","Given while muted and removed afterwards. Set this role to 'cannot send messages' in Roles settings for a hard mute.":"Während der Stummschaltung vergeben und danach entfernt. Stell diese Rolle in den Rolleneinstellungen auf „kann keine Nachrichten senden“ für eine harte Stummschaltung.","Warning limit":"Verwarnungslimit","Act automatically when a member collects too many warnings.":"Automatisch ha nal","Lock everything":"Bloquear tudo","Root apps can't change channel permissions, so OmniRoot removes other members' messages while a channel is locked.":"As apps do Root não podem alterar as permissões dos canais, por isso o OmniRoot remove as mensagens dos outros membros enquanto um canal está bloqueado.",Moderators:"Moderadores","Who can use the moderation commands in chat. Admins, and roles that can kick or ban, always can.":"Quem pode usar os comandos de moderação no chat. Os admins, e os cargos que podem expulsar ou banir, podem sempre.","Moderator roles":"Cargos de moderador","Send moderators a private notification for auto-mod actions and warning limits":"Enviar aos moderadores uma notificação privada por ações do automod e limites de avisos","Mod log channel":"Canal do registo de moderação","Every warning, mute, kick, ban and auto-mod action is posted here.":"Cada aviso, silenciamento, expulsão, banimento e ação do automod é publicado aqui.","No mod log":"Sem registo",Muting:"Silenciamento","Muted members can't talk: OmniRoot removes their messages until the mute ends.":"Os membros silenciados não podem falar: o OmniRoot remove as mensagens até o silenciamento acabar.","Delete messages from muted members":"Eliminar mensagens de membros silenciados","Also mute them in voice calls":"Silenciá-los também em chamadas de voz","Muted role (optional)":"Cargo de silenciado (opcional)","Given while muted and removed afterwards. Set this role to 'cannot send messages' in Roles settings for a hard mute.":"Atribuído durante o silenciamento e removido depois. Define este cargo como 'não pode enviar mensagens' nas definições de cargos para um silenciamento total.","Warning limit":"Limite de avisos","Act automatically when a member collects too many warnings.":"Agir automaticamente quando um membro junta demasiados avisos.","Warnings before action":"Avisos antes da ação","Do nothing":"Não fazer nada","Mute for (minutes)":"Silenciar durante (minutos)","When the limit is r
